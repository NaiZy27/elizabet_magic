<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRM{% endblock %} — Elizabet Magic</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30252b;
      background: #f7f3f5;
      --ink: #30252b;
      --muted: #84747c;
      --line: #eadde3;
      --brand: #9f2f61;
      --brand-dark: #712043;
      --card: #fff;
      --good: #297058;
      --warn: #a86621;
      --bad: #a83949;
      --sidebar: #2c1822;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .sidebar { background: var(--sidebar); color: #fff; padding: 25px 17px; position: sticky; top: 0; height: 100vh; z-index: 10; }
    .brand { font-family: Georgia, serif; font-size: 23px; line-height: 1.1; margin: 0 6px 30px; }
    .brand small { display: block; margin-top: 7px; color: #d4aabb; font: 700 10px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 6px; }
    .nav a { display: flex; gap: 10px; align-items: center; color: #eadde3; text-decoration: none; padding: 11px 12px; border-radius: 11px; font-size: 14px; }
    .nav a:hover, .nav a.active { color: #fff; background: #ffffff14; }
    .nav .icon { width: 19px; text-align: center; opacity: .9; }
    .sidebar .logout { position: absolute; bottom: 22px; left: 17px; right: 17px; }
    .sidebar .logout button { width: 100%; background: #ffffff0d; color: #fff; border: 1px solid #ffffff22; }
    .main { padding: 28px 30px 40px; min-width: 0; }
    .topline { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 22px; }
    .topline h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(28px, 3vw, 38px); font-weight: 600; letter-spacing: -.02em; }
    .topline h2 { margin: 0; }
    .topline p { margin: 7px 0 0; color: var(--muted); }
    .eyebrow { margin-bottom: 7px; color: var(--brand); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 17px; padding: 20px; box-shadow: 0 8px 26px #5c2c4208; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 22px; }
    .metric { position: relative; overflow: hidden; }
    .metric::after { content: ""; position: absolute; width: 64px; height: 64px; border-radius: 50%; right: -24px; top: -25px; background: #b5577f12; }
    .metric strong { display: block; margin-top: 8px; font-family: Georgia, serif; font-size: 27px; }
    .metric small { display: block; margin-top: 4px; color: var(--muted); }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .button, button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: var(--brand); color: white; padding: 10px 14px; text-decoration: none; font: 700 14px inherit; cursor: pointer; }
    .button.secondary, button.secondary { background: #f2e7ec; color: var(--brand-dark); }
    .button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--muted); padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    td { padding: 13px 10px; border-bottom: 1px solid #f1e8ed; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td a { color: var(--brand); font-weight: 700; text-decoration: none; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .field-input, input, select, textarea { width: 100%; border: 1px solid #d9cbd2; border-radius: 10px; padding: 10px 11px; background: white; color: var(--ink); font: inherit; }
    input[type=checkbox] { width: auto; }
    .filters input { max-width: 330px; }
    .filters select { width: auto; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-row label { display: block; margin-bottom: 7px; font-weight: 700; }
    .form-row .helptext { display: block; color: var(--muted); margin-top: 5px; font-size: 12px; }
    .errors { color: var(--bad); margin: 6px 0; font-size: 13px; }
    .badge { display: inline-block; border-radius: 999px; padding: 5px 9px; background: #eee; color: #665b60; font-size: 12px; font-weight: 750; }
    .badge.new { background: #f9e2ed; color: #8e2856; }
    .badge.assembling { background: #fff0d8; color: #8d5d18; }
    .badge.handed_to_pickup { background: #e9e5fa; color: #61509a; }
    .badge.in_transit { background: #deeffb; color: #326c91; }
    .badge.completed, .badge.paid { background: #dff3e9; color: var(--good); }
    .badge.waiting_payment, .badge.pending { background: #fff0d9; color: var(--warn); }
    .badge.cancelled, .badge.failed { background: #fde5e8; color: var(--bad); }
    .flash { padding: 12px 14px; background: #e2f5ea; color: var(--good); border-radius: 11px; margin-bottom: 16px; }
    .pagination { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 16px; }
    .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 18px; }
    .stack { display: grid; gap: 16px; align-content: start; }
    .kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 9px; padding: 9px 0; border-bottom: 1px solid #f1e8ed; }
    .kv:last-child { border-bottom: 0; }
    .danger-note { padding: 12px; background: #fff4dd; border-radius: 10px; color: #765019; }
    code { background: #f4edf1; padding: 2px 6px; border-radius: 6px; }
    .empty { text-align: center; padding: 34px; color: var(--muted); }

    .board-shell { margin: 0 -30px; padding: 0 30px 15px; overflow-x: auto; }
    .kanban-board { display: grid; grid-template-columns: repeat(5, minmax(270px, 1fr)); gap: 13px; min-width: 1430px; align-items: start; }
    .kanban-column { min-height: 520px; padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: #f1eaee; transition: background .18s, border-color .18s; }
    .kanban-column[data-status="new"] { background: #f6eaf0; }
    .kanban-column[data-status="assembling"] { background: #f5eee3; }
    .kanban-column[data-status="handed_to_pickup"] { background: #eeebf6; }
    .kanban-column[data-status="in_transit"] { background: #e9f0f4; }
    .kanban-column[data-status="completed"] { background: #e8f1ed; }
    .kanban-column.drag-over { border-color: var(--brand); background: #f7e4ed; }
    .column-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 3px 14px; }
    .column-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; }
    .column-dot { width: 9px; height: 9px; border-radius: 50%; background: #a34d73; box-shadow: 0 0 0 4px #a34d7315; }
    [data-status="assembling"] .column-dot { background: #b78336; }
    [data-status="handed_to_pickup"] .column-dot { background: #7764a7; }
    [data-status="in_transit"] .column-dot { background: #4e83a2; }
    [data-status="completed"] .column-dot { background: #4f806b; }
    .column-count { display: grid; place-items: center; min-width: 25px; height: 25px; border-radius: 8px; background: #ffffffa6; color: var(--muted); font-size: 12px; font-weight: 800; }
    .column-cards { display: grid; gap: 10px; min-height: 448px; align-content: start; }
    .order-card { position: relative; padding: 15px; border: 1px solid #e8dbe1; border-radius: 14px; background: #fff; box-shadow: 0 5px 17px #4e26380b; cursor: grab; transition: transform .16s, opacity .16s, box-shadow .16s; }
    .order-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px #4e263816; }
    .order-card.dragging { opacity: .45; transform: rotate(1deg); }
    .order-card a { color: inherit; text-decoration: none; }
    .order-number { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--brand); font-size: 12px; font-weight: 850; letter-spacing: .04em; }
    .order-date { color: var(--muted); font-weight: 600; letter-spacing: 0; }
    .customer-name { margin: 0 0 8px; font-family: Georgia, serif; font-size: 18px; }
    .order-product { min-height: 38px; margin: 0 0 13px; color: #5d5057; font-size: 13px; line-height: 1.45; }
    .order-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 11px; border-top: 1px solid #f1e7eb; }
    .order-price { font-size: 15px; font-weight: 850; }
    .order-city { max-width: 115px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; text-align: right; }
    .drop-empty { padding: 38px 12px; border: 1px dashed #d8c8d0; border-radius: 12px; color: #a19098; text-align: center; font-size: 12px; }
    .board-help { color: var(--muted); font-size: 13px; }
    .board-saving { position: fixed; right: 24px; bottom: 24px; z-index: 20; padding: 11px 15px; border-radius: 11px; background: var(--sidebar); color: #fff; box-shadow: 0 8px 28px #0003; opacity: 0; pointer-events: none; transform: translateY(10px); transition: .2s; }
    .board-saving.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .split { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      .sidebar { height: auto; position: static; padding: 19px; }
      .brand { margin-bottom: 17px; }
      .nav { grid-template-columns: 1fr 1fr; }
      .sidebar .logout { position: static; margin-top: 15px; }
      .main { padding: 20px 16px 30px; }
      .board-shell { margin: 0 -16px; padding: 0 16px 12px; }
      .grid, .form-grid { grid-template-columns: 1fr; }
      .card { overflow-x: auto; }
      .topline { display: block; }
      .actions { margin-top: 14px; }
      .kv { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Elizabet Magic<small>CRM мастерской</small></div>
    <nav class="nav">
      <a class="{% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'orders' or request.resolver_match.url_name == 'order_detail' %}active{% endif %}" href="{% url 'control:dashboard' %}"><span class="icon">▦</span> Заказы</a>
      <a class="{% if request.resolver_match.url_name == 'catalog' %}active{% endif %}" href="{% url 'control:catalog' %}"><span class="icon">◇</span> Каталог</a>
      <a class="{% if request.resolver_match.url_name == 'delivery' %}active{% endif %}" href="{% url 'control:delivery' %}"><span class="icon">→</span> Доставка</a>
      <a class="{% if request.resolver_match.url_name == 'pickup_points' %}active{% endif %}" href="{% url 'control:pickup_points' %}"><span class="icon">⌖</span> Пункты выдачи</a>
      <a class="{% if request.resolver_match.url_name == 'customers' %}active{% endif %}" href="{% url 'control:customers' %}"><span class="icon">○</span> Клиенты</a>
      <a class="{% if request.resolver_match.url_name == 'database' %}active{% endif %}" href="{% url 'control:database' %}"><span class="icon">▤</span> База данных</a>
    </nav>
    <form class="logout" method="post" action="{% url 'control:logout' %}">{% csrf_token %}<button class="secondary" type="submit">Выйти</button></form>
  </aside>
  <main class="main">
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
