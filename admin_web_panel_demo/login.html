<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Elizabet Magic</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f8edf3;color:#34252d}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:white;border:1px solid #ead7e1;border-radius:24px;padding:30px;box-shadow:0 20px 70px #67274320}h1{font-family:Georgia,serif;color:#8d2857;margin:0 0 5px}p{color:#7d6a74}label{font-weight:700;display:block;margin:16px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #d9c7d0;border-radius:11px;padding:12px;font:inherit}button{width:100%;margin-top:20px;border:0;border-radius:11px;padding:13px;background:#a72e67;color:white;font-weight:700}.error{background:#fde9ec;color:#a42d40;padding:11px;border-radius:10px}</style></head><body><main class="box"><h1>Elizabet Magic</h1><p>Вход в веб-админку</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" autofocus required><label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Войти</button></form></main></body></html>
