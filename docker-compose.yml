# Боевая конфигурация. Наружу опубликован только web на 127.0.0.1:8000 —
# снаружи к нему ходит nginx с хоста (см. deploy/nginx/).

# Логи контейнеров: не больше 3 файлов по 10 МБ на сервис. Без ограничения
# Docker копит их бесконечно, и за месяцы они съедают диск сервера.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *logging
  build: .
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-em}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:-elizabet_magic}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-em} -d ${POSTGRES_DB:-elizabet_magic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Healthcheck: web отвечает на /healthz, bot и worker регулярно отмечают «пульс»
  # (core.health). Пульс воркера ставит задача планировщика — он заодно проверяет и
  # scheduler. Статус смотрит deploy/healthcheck.sh (cron на хосте) и пишет в Telegram.
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "core.health", "http", "http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot:
    <<: *app
    command: ["python", "-m", "bot.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "core.health", "beat", "bot", "120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    # Остановка при деплое: воркер перестаёт брать новые задачи и до 30 секунд
    # доделывает начатые. Сообщения клиентам при этом не теряются в любом случае —
    # они лежат в таблице outbox, пока не отправлены.
    # --workers 1: по умолчанию taskiq поднимает 2 процесса — это лишняя память и
    # два разборщика outbox, которые путают порядок сообщений клиенту.
    command: ["taskiq", "worker", "worker.broker:broker", "worker.tasks",
              "--workers", "1", "--wait-tasks-timeout", "30"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "core.health", "beat", "worker", "300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  scheduler:
    <<: *app
    # worker.tasks обязателен: без импорта задач у планировщика пустое расписание.
    command: ["taskiq", "scheduler", "worker.broker:scheduler", "worker.tasks"]

volumes:
  pgdata:
  redisdata:
